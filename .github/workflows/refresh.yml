name: Refresh catalog

on:
  schedule:
    - cron: '17 6 * * *'   # daily, ~06:17 UTC
  workflow_dispatch: {}    # also run on demand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - name: Fetch models from all creators
        run: npm run fetch

      - name: Commit updated catalog (if changed)
        run: |
          git config user.name  "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          if git diff --quiet -- data/models.json; then
            echo "no changes"
          else
            git add data/models.json
            git commit -m "chore: refresh catalog"
            git push
          fi
