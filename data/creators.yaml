# =====================================================================
#  Your curated list of digital sculptors.
#
#  The daily refresh job reads this file, calls the right adapter per
#  platform, and writes data/models.json — which the website displays.
#
#  Supported `platform` values:
#    myminifactory  — uses public API (most reliable)
#    gumroad        — scrapes product pages
#    payhip         — scrapes shop page
#    artstation     — uses public projects feed
#    tribes         — scrapes creator page
#    generic        — falls back to OpenGraph tags
#
#  Fields:
#    name      (required) — Display name shown in the gallery
#    platform  (required) — One of the values above
#    url       (required) — Their shop/portfolio page
#    tags      (optional) — Categories applied to every model from them
#    featured  (optional) — List of model slugs to mark as ⭐ Featured.
#    limit     (optional) — Max models to pull (default: 24)
# =====================================================================

